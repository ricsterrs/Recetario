<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0A0A0A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--surface:#131313;--ink:#F2F2F2;--mute:#8D8D8D;--line:#272727;--acc:#E3342B;--onacc:#FFFFFF;--danger:#EE5A50;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(760px 420px at 92% -10%,rgba(227,52,43,.10),transparent 64%) no-repeat,var(--bg);color:var(--ink);font:400 15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.serif{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px}
header{padding-top:36px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-weight:500;font-size:46px;line-height:1;letter-spacing:-.01em;margin:0}
#st{font-size:12px;color:var(--mute)}#st.err{color:var(--danger)}
.search{margin-top:22px}
.search input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;font-size:16px}
.search input::placeholder{color:var(--mute)}
.tabs{display:flex;gap:26px;overflow-x:auto;margin-top:22px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 0 12px;white-space:nowrap;color:var(--mute);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.tab.add{color:var(--acc)}
.meta{display:flex;justify-content:space-between;margin:18px 0 20px;color:var(--mute);font-size:13px}
.link{color:var(--acc);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 20px}h1{font-size:60px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:block;width:100%}
.ph{aspect-ratio:4/5;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-size:64px;color:var(--line);font-weight:400}
.card h3{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-weight:500;font-size:24px;line-height:1.1;margin:12px 0 2px}
.card p{margin:0;color:var(--mute);font-size:13px}
.card.new .ph{border-style:dashed;flex-direction:column;gap:6px;color:var(--mute);background:none;font-size:14px}
.card.new .ph b{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-size:44px;font-weight:400;line-height:1}
.empty{grid-column:1/-1;color:var(--mute);padding:20px 0}
/* hoja de detalle */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
#sheet.open{display:block;animation:up .24s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet.open{animation:none}}
.in{max-width:560px;margin:0 auto;padding:16px 20px 56px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.bar button{color:var(--acc);padding:8px 0}
.hero{aspect-ratio:4/5;max-height:62vh;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
h2{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-weight:500;font-size:42px;line-height:1.02;margin:22px 0 14px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:12px 0}.facts div+div{padding-left:16px;border-left:1px solid var(--line)}
.lbl{display:block;color:var(--mute);font-size:12.5px;margin-bottom:2px}
.facts span:not(.lbl){font-size:16px}
.sec{margin-top:30px}
.ing{display:flex;align-items:baseline;gap:8px;padding:7px 0;font-size:16px}
.ing i{flex:1;border-bottom:1px dotted var(--mute);opacity:.5;transform:translateY(-4px)}
.ing em{font-style:normal;color:var(--mute);text-align:right}
.decor{margin-top:30px;padding:4px 0 4px 18px;border-left:2px solid var(--acc)}
.decor p{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-size:24px;line-height:1.25;margin:2px 0 0}
.note{margin:6px 0 0;color:var(--mute);white-space:pre-wrap}
.acts{display:flex;gap:22px;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
.acts .del{color:var(--danger)}
/* edición */
.fld{margin-top:22px}
.fld input,.fld textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;font-size:16px;border-radius:0;resize:none}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc)}
.nm input{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-size:34px;font-weight:500;padding:4px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 104px 30px;gap:12px;align-items:center}
.irow+.irow{margin-top:4px}
.x{color:var(--mute);font-size:22px;line-height:1;text-align:center;padding:6px 0}
.btn{display:inline-block;color:var(--acc);padding:10px 0;font-size:15px}
.primary{background:var(--acc);color:var(--onacc);padding:14px 22px;border-radius:2px;text-align:center;flex:1;font-weight:500}
.ghost{padding:14px 8px;color:var(--mute)}
.photo{display:flex;gap:20px;align-items:center;margin-top:8px}
.photo label{cursor:pointer}
.foot{display:flex;gap:10px;margin-top:36px}
/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.5);display:none;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
#modal.open{display:flex}
.box{background:var(--bg);width:100%;max-width:440px;padding:26px 22px 22px;border-radius:6px 6px 0 0}
@media(min-width:600px){#modal{align-items:center}.box{border-radius:6px}}
.box h4{font-family:"Bricolage Grotesque","Manrope",system-ui,sans-serif;font-weight:500;font-size:28px;margin:0 0 8px}
.box p{margin:0 0 6px;color:var(--mute)}
.box input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;font-size:16px;margin-top:8px}
.box input:focus{outline:none;border-color:var(--acc)}
.box .foot{margin-top:24px;flex-wrap:wrap}
button{transition:transform .18s ease,opacity .18s}
button:active{transform:scale(.97)}
.wrap{padding-bottom:130px}
header{animation:rise2 .8s cubic-bezier(.2,.8,.2,1) backwards}
.ph{background:linear-gradient(160deg,var(--surface),var(--bg))}
.card:active{transform:scale(.975)}
.card .ph{transition:border-color .3s}
.card .ph img{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.card:hover .ph img{transform:scale(1.05)}.card:hover .ph{border-color:var(--acc)}}
.grid.anim .card{animation:rise .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(6px)}}
@keyframes rise2{from{opacity:0;transform:translateY(16px)}}
.tabs{position:relative;display:block;overflow-x:auto;border-bottom:1px solid var(--line)}
#tabi{display:flex;gap:26px;width:max-content;min-width:100%}
.tab{border-bottom:0;margin:0;transition:color .3s}
#ind{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc);border-radius:2px;transition:transform .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1)}
.search input{background:linear-gradient(var(--acc),var(--acc)) no-repeat left bottom/0 1px;transition:background-size .6s cubic-bezier(.2,.8,.2,1)}
.search input:focus{background-size:100% 1px;outline:none}
#st{display:inline-flex;align-items:center;gap:8px}
#st:not(:empty)::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc)}
#st.busy::before{animation:pulse 1s ease-in-out infinite}
#st.err::before{background:var(--danger)}
@keyframes pulse{50%{opacity:.25;transform:scale(1.7)}}
.fab{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:10px;padding:15px 24px 15px 20px;border-radius:999px;background:var(--acc);color:var(--onacc);font-weight:500;box-shadow:0 12px 34px rgba(0,0,0,.55);animation:fabin .9s .5s cubic-bezier(.2,.8,.2,1) backwards}
.fab:active{transform:translateX(-50%) scale(.95)}
.fab svg{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fab:hover svg{transform:rotate(90deg)}
@keyframes fabin{from{opacity:0;transform:translate(-50%,34px)}}
.bar [data-act='edit']{border:1px solid var(--line);border-radius:99px;padding:8px 20px}
.bar [data-act='close']::before,.bar [data-act='cancel']::before{content:'';display:inline-block;width:8px;height:8px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-right:10px;position:relative;top:-1px}
html.vt #sheet.open{animation:none}
::view-transition-group(hero){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
.hero{view-transition-name:hero}
.hero img{animation:settle 1.5s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes settle{from{transform:scale(1.14)}}
#sheet.enter .in>*:not(.bar):not(.hero){animation:rise2 .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*70ms + .15s)}
#sheet.enter .ing i{animation:grow 1s .5s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:left}
@keyframes grow{from{transform:translateY(-4px) scaleX(0)}}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}}
.foot.stick{position:sticky;bottom:0;margin:20px -20px 0;padding:36px 20px 16px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
#modal{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#modal.open{animation:fade .28s}
#modal.open .box{animation:sheetup .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(44px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.top{align-items:center}
.right{display:flex;align-items:center;gap:12px}
#st{max-width:96px;text-align:right;line-height:1.25;font-size:11px}
.slot{width:44px;height:44px;border-radius:50%;flex:none;display:block}
.slot img{width:100%;height:100%;border-radius:50%;display:block;opacity:0;transition:box-shadow .9s ease}
.slot.on img{opacity:1;box-shadow:0 0 26px rgba(215,50,40,.3)}
@media(min-width:720px){.slot{width:56px;height:56px}}
#splash{position:fixed;inset:0;z-index:60;width:100%;border:0;padding:0;cursor:pointer;background:rgba(10,14,12,.4);-webkit-backdrop-filter:blur(26px) saturate(1.1);backdrop-filter:blur(26px) saturate(1.1)}
#splash:active{transform:none}
#splash .hint{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font-size:13px;letter-spacing:.02em;animation:hint 2.4s 1.4s ease-in-out infinite backwards}
@keyframes hint{0%,100%{opacity:.3}50%{opacity:.9}}
#fly{position:fixed;left:0;top:0;width:176px;height:176px;z-index:61;pointer-events:none;transform-origin:0 0}
#fly img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 90px rgba(215,50,40,.3),0 22px 50px rgba(0,0,0,.5);animation:logoin 1.2s cubic-bezier(.2,.8,.2,1) backwards,breathe 4.5s 1.2s ease-in-out infinite}
@keyframes logoin{from{opacity:0;transform:scale(.76);filter:blur(14px)}}
@keyframes breathe{50%{transform:scale(1.035)}}

body{-webkit-font-smoothing:antialiased;font-weight:400}
h1{font-size:40px;font-weight:600;letter-spacing:-.04em}
@media(min-width:720px){h1{font-size:54px}}
.tab{font-weight:500;font-size:14px}
.tab.add{color:var(--ink)}
.card h3{font-size:18px;font-weight:600;letter-spacing:-.025em;margin:14px 0 3px}
.card p{font-size:12.5px}
.ph{border-radius:2px}
.ph span{font-size:56px;font-weight:300;color:#2c2c2c}
h2{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.04}
.decor p{font-size:19px;font-weight:500;line-height:1.35;letter-spacing:-.015em}
.nm input{font-size:30px;font-weight:600;letter-spacing:-.03em}
.box h4{font-size:22px;font-weight:600;letter-spacing:-.025em}
.bar button{color:var(--ink)}
.link,.btn{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:1px;text-underline-offset:6px}
.primary{background:var(--ink);color:#0A0A0A;font-weight:600;border-radius:999px}
.ghost{color:var(--mute)}
.fab{background:var(--acc);color:#fff;box-shadow:0 12px 36px rgba(227,52,43,.35)}
.slot.on img{box-shadow:0 0 26px rgba(227,52,43,.35)}
.facts{border-color:var(--line)}
.lbl{letter-spacing:.01em}

.comp.has{display:grid;grid-template-columns:92px minmax(0,1fr);gap:22px;align-items:center}
.glass{width:92px;height:auto;color:var(--ink);overflow:visible;filter:drop-shadow(0 14px 30px rgba(227,52,43,.22))}
.ing{gap:10px}.ing span{min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--mute);align-self:center}
.liq{transform-box:fill-box;transform-origin:50% 100%}
#sheet.enter .liq{animation:pour 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.45s + var(--i,0)*.16s)}
@keyframes pour{from{transform:scaleY(0)}}
.bub{fill:#fff;opacity:0;animation:bub 4s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.45}100%{transform:translateY(calc(var(--h) * -1));opacity:0}}
@media(min-width:480px){.comp.has{grid-template-columns:116px minmax(0,1fr)}.glass{width:116px}}
@media (prefers-reduced-motion:reduce){.bub{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>Recetario</h1><div class="right"><span id="st"></span><span class="slot" id="slot"><img alt=""></span></div></div>
    <div class="search"><input id="q" type="search" placeholder="Buscar receta o ingrediente" autocomplete="off" aria-label="Buscar"></div>
    <nav class="tabs" id="tabs" aria-label="Secciones"><div id="tabi"></div><span id="ind"></span></nav>
  </header>
  <div class="meta"><span id="cnt"></span><button class="link" id="editsec">Editar sección</button></div>
  <main class="grid" id="grid"></main>
  <button class="fab" data-act="new" aria-label="Nueva receta"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>Nueva receta</button>
</div>
<div id="sheet" role="dialog" aria-modal="true" aria-label="Receta"></div>
<div id="modal" role="dialog" aria-modal="true"></div>

}
(async()=>{
  try{
    if(!window.claude||!claude.use)throw 0;
    [db,assets]=await Promise.all([claude.use('db'),claude.use('assets')]);
    if(db){
      const snap=await db.doc('carta/state').get();
      if(snap.exists){const d=snap.data();if(d&&d.json){S=JSON.parse(d.json);if(!S.sections.find(x=>x.id===cur))cur=S.sections[0].id;render()}}
    }
  }catch(e){db=null}
})();

const src=i=>!i?'':(i.startsWith('data:')?i:'/_blob/'+i);

/* ---------- Lista ---------- */
function render(){
  $('#tabi').innerHTML=S.sections.map(s=>`<button class="tab" data-sec="${s.id}" aria-current="${s.id===cur}">${esc(s.name)}</button>`).join('')+'<button class="tab add" data-act="addsec">Nueva sección</button>';
  const t=term.trim().toLowerCase();
  const list=S.items.filter(i=>i.sec===cur&&(!t||(i.name+' '+i.ings.map(x=>x.n).join(' ')+' '+i.decor).toLowerCase().includes(t)));
  const all=S.items.filter(i=>i.sec===cur).length;
  $('#cnt').textContent=t?`${list.length} de ${all}`:(all===1?'1 receta':all+' recetas');
  $('#grid').classList.toggle('anim',fx);fx=false;
  $('#grid').innerHTML=list.map((i,x)=>`<button class="card" data-open="${i.id}" style="--n:${Math.min(x,12)}"><div class="ph">${i.img?`<img src="${esc(src(i.img))}" alt="${esc(i.name)}" loading="lazy">`:`<span>${esc((i.name||'?')[0].toUpperCase())}</span>`}</div><h3>${esc(i.name||'Sin nombre')}</h3><p>${esc(i.glass)}</p></button>`).join('')
   
   +(!list.length?`<p class="empty">${t?'No hay recetas que coincidan con la búsqueda.':'Esta sección está vacía. Toca “Nueva receta” para empezar.'}</p>`:'');
  place();
}

/* ---------- Hoja: ver / editar ---------- */
function place(){const a=document.querySelector('.tab[aria-current=true]'),i=$('#ind');if(!a)return;i.style.width=a.offsetWidth+'px';i.style.transform=`translateX(${a.offsetLeft}px)`;a.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
const vt=f=>(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches)?document.startViewTransition(f):(f(),null);
function nameCard(id,on){const c=document.querySelector(`[data-open="${id}"] .ph`);if(c)c.style.viewTransitionName=on?'hero':''}
function showSheet(id){nameCard(id,1);vt(()=>{nameCard(id,0);V={id,edit:false};openSheet(1)})}
function openSheet(f){const s=$('#sheet');s.classList.toggle('enter',!!f);s.innerHTML=V.edit?editHTML():viewHTML();s.classList.add('open');if(f)s.scrollTop=0;document.body.style.overflow='hidden';[...s.querySelector('.in').children].forEach((c,i)=>c.style.setProperty('--k',i))}
function closeSheet(){const id=V&&V.id,r=vt(()=>{$('#sheet').classList.remove('open');document.body.style.overflow='';V=null;nameCard(id,1)});(r&&r.finished?r.finished:Promise.resolve()).finally(()=>nameCard(id,0))}
function addIng(){V.d.ings.push({n:'',q:''});openSheet();const r=document.querySelectorAll('.irow'),l=r[r.length-1];l.classList.add('pop');l.querySelector('input').focus()}
/* ---------- Composición: copa con capas proporcionales ---------- */
const PAL=['#E3342B','#F2F2F2','#8D8D8D','#B3221B','#CFCFCF','#FF6F61','#5A5A5A'];
const GL={tall:{p:'M22 8H78L72 142H28Z',a:14,b:140},short:{p:'M18 40H82L77 140H23Z',a:46,b:138},coupe:{p:'M12 30H88C88 70 68 92 54 94V128H70V136H30V128H46V94C32 92 12 70 12 30Z',a:34,b:92}};
function comp(i){
  const g=(i.glass||'').toLowerCase(),gl=/coupe|copa/.test(g)?GL.coupe:/corto/.test(g)?GL.short:GL.tall;
  const vs=i.ings.map(x=>{const q=(x.q||'').toLowerCase(),m=q.match(/(\d+(?:[.,]\d+)?)\s*(ml|cl|oz)/);let v=0,top=false;
    if(m){v=parseFloat(m[1].replace(',','.'));if(m[2]==='cl')v*=10;if(m[2]==='oz')v*=30}else if(/complet|mitad|llenar/.test(q))top=true;return{v,top}});
  const sum=vs.reduce((s,x)=>s+x.v,0),nt=vs.filter(x=>x.top).length;
  const tv=nt?Math.max(70,sum*1.1)/nt:0,total=sum+tv*nt;
  if(!total)return{svg:'',dots:[]};
  const H=(gl.b-gl.a)*.9;let y=gl.b,c=0,k=0,rects='';const dots=[];
  vs.forEach(x=>{const v=x.top?tv:x.v;if(!v){dots.push('<b class="dot"></b>');return}
    const col=PAL[c++%PAL.length],h=v/total*H;y-=h;
    rects+=`<rect class="liq" style="--i:${k++}" x="0" y="${y.toFixed(1)}" width="100" height="${(h+.6).toFixed(1)}" fill="${col}"/>`;
    dots.push(`<b class="dot" style="background:${col};border-color:${col}"></b>`)});
  let bub='';for(let n=0;n<7;n++)bub+=`<circle class="bub" cx="${(30+n*6.5).toFixed(1)}" cy="${gl.b-5}" r="${(1+(n%3)*.6).toFixed(1)}" style="--h:${H.toFixed(0)}px;animation-duration:${(3.2+n*.45).toFixed(1)}s;animation-delay:${(n*.7+1.2).toFixed(1)}s"/>`;
  const svg=`<svg class="glass" viewBox="0 0 100 150" aria-hidden="true"><defs><clipPath id="gc"><path d="${gl.p}"/></clipPath></defs><g clip-path="url(#gc)">${rects}${bub}</g><path d="${gl.p}" fill="none" stroke="currentColor" stroke-opacity=".6" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  return{svg,dots}}
function viewHTML(){
  const i=S.items.find(x=>x.id===V.id),C=comp(i);
  return `<div class="in"><div class="bar"><button data-act="close">Volver</button><button data-act="edit">Editar</button></div>
  ${i.img?`<div class="hero"><img src="${esc(src(i.img))}" alt="${esc(i.name)}"></div>`:''}
  <h2>${esc(i.name)}</h2>
  <div class="facts"><div><span class="lbl">Vaso</span><span>${esc(i.glass||'Sin definir')}</span></div><div><span class="lbl">Método</span><span>${esc(i.method||'Sin definir')}</span></div></div>
  <div class="sec"><span class="lbl">Composición</span><div class="comp${C.svg?' has':''}">${C.svg}<div class="ings">${i.ings.map((x,k)=>(x.n||x.q)?`<div class="ing">${C.dots[k]||''}<span>${esc(x.n)}</span><i></i><em>${esc(x.q)}</em></div>`:'').join('')||'<p class="note">Aún no hay ingredientes.</p>'}</div></div></div>
  ${i.decor?`<div class="decor"><span class="lbl">Decoración</span><p>${esc(i.decor)}</p></div>`:''}
  ${i.notes?`<div class="sec"><span class="lbl">Notas</span><p class="note">${esc(i.notes)}</p></div>`:''}
  <div class="acts"><button class="btn" data-act="dup" style="padding:0">Duplicar</button><button class="btn del" data-act="del" style="padding:0">Eliminar</button></div></div>`;
}
function editHTML(){
  const d=V.d;
  return `<div class="in"><div class="bar"><button data-act="cancel">Cancelar</button><span class="lbl" style="margin:0">${V.isNew?'Nueva receta':'Editando'}</span></div>
  <div class="photo">${d.img?`<div class="hero" style="width:120px;aspect-ratio:4/5"><img src="${esc(src(d.img))}" alt=""></div>`:''}
    <div><label class="btn" id="pl"><input type="file" accept="image/*" id="file" hidden>${d.img?'Cambiar imagen':'Agregar imagen'}</label>${d.img?'<br><button class="btn" style="color:var(--mute)" data-act="rmimg">Quitar imagen</button>':''}</div></div>
  <div class="fld nm"><label class="lbl" for="f-name">Nombre</label><input id="f-name" data-f="name" value="${esc(d.name)}" placeholder="Nombre del coctel"></div>
  <div class="row2"><div class="fld"><label class="lbl" for="f-glass">Vaso</label><input id="f-glass" data-f="glass" value="${esc(d.glass)}" placeholder="Vaso largo"></div>
  <div class="fld"><label class="lbl" for="f-method">Método</label><input id="f-method" data-f="method" value="${esc(d.method)}" placeholder="Shake"></div></div>
  <div class="fld"><span class="lbl">Ingredientes</span>${d.ings.map((x,k)=>`<div class="irow"><input data-i="${k}" data-k="n" value="${esc(x.n)}" placeholder="Ingrediente" aria-label="Ingrediente"><input data-i="${k}" data-k="q" value="${esc(x.q)}" placeholder="60 ml" aria-label="Cantidad"><button class="x" data-rm="${k}" aria-label="Quitar ingrediente">&times;</button></div>`).join('')}
  <button class="btn" data-act="adding">Agregar ingrediente</button></div>
  <div class="fld"><label class="lbl" for="f-decor">Decoración</label><textarea id="f-decor" data-f="decor" rows="2" placeholder="Escarchado, garnish, fruta deshidratada">${esc(d.decor)}</textarea></div>
  <div class="fld"><label class="lbl" for="f-notes">Notas</label><textarea id="f-notes" data-f="notes" rows="2" placeholder="Preparación, variantes, recordatorios">${esc(d.notes)}</textarea></div>
  <div class="foot stick"><button class="ghost" data-act="cancel">Cancelar</button><button class="primary" data-act="save">Guardar receta</button></div></div>`;
}
function startEdit(i,isNew){V={id:i.id,edit:true,isNew,d:JSON.parse(JSON.stringify(i))};if(!V.d.ings.length)V.d.ings.push({n:'',q:''});openSheet(1)}

/* ---------- Imagen ---------- */
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=1100,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};im.onerror=no;im.src=u})}
async function pickImage(file){
  const l=$('#pl');const old=l.lastChild.textContent;l.lastChild.textContent='Subiendo imagen';
  try{
    const b=await shrink(file);
    if(assets){const r=await assets.upload(b);V.d.img=r.id}
    else V.d.img=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)});
    openSheet();
  }catch(e){l.lastChild.textContent=old;setSt('No se pudo cargar la imagen',true)}
}

/* ---------- Modal ---------- */
function modal(html){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="box">${html}</div>`;m.classList.add('open');
  const done=r=>{const v=m.querySelector('input');m.classList.remove('open');res({r,val:v?v.value.trim():''})};
  m.onclick=e=>{const b=e.target.closest('[data-r]');if(b)done(b.dataset.r);else if(e.target===m)done('x')};
  const inp=m.querySelector('input');if(inp){inp.onkeydown=e=>{if(e.key==='Enter')done('ok')};setTimeout(()=>inp.focus(),40)}
})}
const confirmBox=(t,p,b)=>modal(`<h4>${t}</h4><p>${p}</p><div class="foot"><button class="ghost" data-r="x">Cancelar</button><button class="primary" style="background:var(--danger);color:#fff" data-r="ok">${b}</button></div>`);

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.sec){if(t.dataset.sec!==cur){cur=t.dataset.sec;fx=true;render()}return}
  if(t.dataset.open){showSheet(t.dataset.open);return}
  if(t.dataset.rm!==undefined){V.d.ings.splice(+t.dataset.rm,1);if(!V.d.ings.length)V.d.ings.push({n:'',q:''});openSheet();return}
  if(t.id==='editsec'){
    const s=S.sections.find(x=>x.id===cur),n=S.items.filter(i=>i.sec===cur).length;
    const r=await modal(`<h4>Sección</h4><p>Nombre de la sección</p><input value="${esc(s.name)}" aria-label="Nombre de la sección"><div class="foot"><button class="primary" data-r="ok">Guardar</button><button class="ghost" data-r="x">Cancelar</button>${S.sections.length>1?'<button class="ghost" style="color:var(--danger)" data-r="del">Eliminar sección</button>':''}</div>`);
    if(r.r==='ok'&&r.val){s.name=r.val;persist();render()}
    if(r.r==='del'){const c=await confirmBox('Eliminar sección',n?`Se eliminarán también las ${n} recetas de esta sección.`:'La sección está vacía.','Eliminar');
      if(c.r==='ok'){S.items=S.items.filter(i=>i.sec!==cur);S.sections=S.sections.filter(x=>x.id!==cur);cur=S.sections[0].id;persist();render()}}
    return;
  }
  switch(t.dataset.act){
    case 'addsec':{const r=await modal('<h4>Nueva sección</h4><p>Por ejemplo: Sin alcohol, Entradas, Postres</p><input placeholder="Nombre de la sección" aria-label="Nombre de la sección"><div class="foot"><button class="primary" data-r="ok">Crear sección</button><button class="ghost" data-r="x">Cancelar</button></div>');
      if(r.r==='ok'&&r.val){const s={id:'s'+uid(),name:r.val};S.sections.push(s);cur=s.id;persist();render()}break}
    case 'new':startEdit({id:'r'+uid(),sec:cur,name:'',glass:'',method:'',ings:[],decor:'',notes:'',img:''},true);break;
    case 'close':closeSheet();break;
    case 'edit':startEdit(S.items.find(x=>x.id===V.id),false);break;
    case 'cancel':if(V.isNew)closeSheet();else{V.edit=false;openSheet(1)}break;
    case 'adding':addIng();break;
    case 'rmimg':V.d.img='';openSheet();break;
    case 'save':{
      const d=V.d;d.name=d.name.trim()||'Sin nombre';d.ings=d.ings.filter(x=>x.n.trim()||x.q.trim());
      const k=S.items.findIndex(x=>x.id===d.id);if(k>=0)S.items[k]=d;else S.items.push(d);
      V={id:d.id,edit:false};persist();render();openSheet(1);break}
    case 'dup':{const i=JSON.parse(JSON.stringify(S.items.find(x=>x.id===V.id)));i.id='r'+uid();i.name='Copia de '+i.name;startEdit(i,true);break}
    case 'del':{const c=await confirmBox('Eliminar receta','Esta acción no se puede deshacer.','Eliminar');
      if(c.r==='ok'){S.items=S.items.filter(x=>x.id!==V.id);persist();closeSheet();render()}break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){term=t.value;render();return}
  if(!V||!V.edit)return;
  if(t.dataset.f)V.d[t.dataset.f]=t.value;
  else if(t.dataset.i!==undefined)V.d.ings[+t.dataset.i][t.dataset.k]=t.value;
});
document.addEventListener('change',e=>{if(e.target.id==='file'&&e.target.files[0])pickImage(e.target.files[0])});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&V&&!$('#modal').classList.contains('open')){V.edit&&V.isNew?closeSheet():V.edit?(V.edit=false,openSheet()):closeSheet()}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k==='q'){e.preventDefault();addIng()}
});
if(document.startViewTransition)document.documentElement.classList.add('vt');
render();setSt('');
if(document.fonts)document.fonts.ready.then(place);addEventListener('resize',place);

/* ---------- Pantalla de inicio ---------- */
(()=>{
  const sp=$('#splash'),fly=$('#fly'),img=fly.querySelector('img'),slot=$('#slot'),S0=176,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  slot.querySelector('img').src=img.src;
  const center=()=>{fly.style.transform=`translate(${(innerWidth-S0)/2}px,${(innerHeight-S0)/2-16}px) scale(1)`};
  center();addEventListener('resize',center);scrollTo(0,0);
  document.body.style.overflow='hidden';sp.focus({preventScroll:true});
  let done=false;
  sp.addEventListener('click',()=>{
    if(done)return;done=true;removeEventListener('resize',center);
    const r=slot.getBoundingClientRect(),from=fly.style.transform,to=`translate(${r.left}px,${r.top}px) scale(${r.width/S0})`;
    const cs=getComputedStyle(img),ct=cs.transform,sh=cs.boxShadow;
    img.animate([{transform:ct,boxShadow:sh},{transform:'none',boxShadow:'0 0 0 0 rgba(0,0,0,0)'}],{duration:reduce?1:700,easing:'ease-out',fill:'forwards'});
    const a=fly.animate([{transform:from},{transform:to}],{duration:reduce?1:1050,easing:'cubic-bezier(.7,0,.15,1)',fill:'forwards'});
    sp.animate([{opacity:1},{opacity:0}],{duration:reduce?1:900,easing:'ease-in-out',fill:'forwards'});
    a.finished.then(()=>{slot.classList.add('on');fly.remove();sp.remove();document.body.style.overflow=''}).catch(()=>{});
  });
})();
</script>
